<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pastillero Cuidador</title>
<meta name="description" content="Panel para familiares y enfermeros del pastillero inteligente">
<meta name="theme-color" content="#1F7A72">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Concepto: app de cuidador, una columna de lectura rapida; el estado manda (chips de color) y los
   recipientes conservan el color de su tapa fisica (rojo, azul, verde) en toda la app. */
:root {
  --bg: #F3F6F5;
  --surface: #FFFFFF;
  --surface-2: #E9EFED;
  --fg: #142321;
  --muted: #586A67;
  --line: #D6DFDC;
  --accent: #1F7A72;
  --accent-fg: #FFFFFF;
  --accent-soft: #DCEFEC;
  --ok: #23734A;   --ok-soft: #DDF0E4;
  --warn: #9A5B00; --warn-soft: #FBEBCF;
  --bad: #B3261E;  --bad-soft: #F9DEDC;
  --r1: #D2524C; --r2: #2F74B8; --r3: #3E8E4E;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(20, 35, 33, .06), 0 4px 14px rgba(20, 35, 33, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1514; --surface: #162120; --surface-2: #1E2B29; --fg: #E4EEEB; --muted: #95A8A4; --line: #283835;
    --accent: #4DB6AA; --accent-fg: #06201D; --accent-soft: #173A36;
    --ok: #6CCB94; --ok-soft: #173326; --warn: #F0B45A; --warn-soft: #3A2B12; --bad: #F2938C; --bad-soft: #3D1C1A;
    --r1: #EE7F79; --r2: #6FA9E6; --r3: #78C487;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1514; --surface: #162120; --surface-2: #1E2B29; --fg: #E4EEEB; --muted: #95A8A4; --line: #283835;
  --accent: #4DB6AA; --accent-fg: #06201D; --accent-soft: #173A36;
  --ok: #6CCB94; --ok-soft: #173326; --warn: #F0B45A; --warn-soft: #3A2B12; --bad: #F2938C; --bad-soft: #3D1C1A;
  --r1: #EE7F79; --r2: #6FA9E6; --r3: #78C487;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }

/* ---------- estructura ---------- */
.shell { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.topbar .who { min-width: 0; }
.topbar .who small { display: block; color: var(--muted); font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; }
.topbar .who strong { display: block; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main {
  flex: 1; display: flex; flex-direction: column; gap: 20px;
  padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabs nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button {
  background: none; border: 0; padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: .75rem; color: var(--muted); cursor: pointer; min-height: 60px;
}
.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabs button:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, .switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { font-size: 1.05rem; }
.eyebrow { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); min-height: 60px; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 700; overflow-wrap: anywhere; }
.chiprow { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.row .sub { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
button.row { width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; }
button.row:first-child { border-top: 0; }
button.row:hover { background: var(--surface-2); }

/* ---------- controles ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn.small { min-height: 38px; padding: 0 12px; font-size: .9rem; }
.btn:disabled { opacity: .55; cursor: default; }
.icon-btn { background: none; border: 0; padding: 8px; border-radius: 10px; cursor: pointer; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: .95rem; }
.field .hint { color: var(--muted); font-size: .85rem; }
.field input, .field select, .field textarea {
  min-height: 48px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); width: 100%;
}
.field textarea { min-height: 88px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.field .err { color: var(--bad); font-size: .85rem; }
.form { display: flex; flex-direction: column; gap: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.switch { position: relative; display: inline-flex; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch span { width: 50px; height: 30px; border-radius: 30px; background: var(--line); position: relative; transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.check { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check:first-of-type { border-top: 0; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }

/* ---------- chips de estado ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: .85rem; font-weight: 700; white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.idle { background: var(--surface-2); color: var(--muted); }
.chip.plain::before { display: none; }

/* recipiente: numero dentro de un circulo del color de la tapa */
.rec { --rc: var(--r1); flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; background: var(--rc); font-family: var(--font-num); }
.rec.r2 { --rc: var(--r2); } .rec.r3 { --rc: var(--r3); }
.rec.sm { width: 24px; height: 24px; font-size: .8rem; }

/* ---------- panel ---------- */
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-size: .95rem; }
.banner.warn { background: var(--warn-soft); color: var(--fg); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner.info { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.banner.bad { background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.next { padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
.next .time { font-family: var(--font-num); font-size: 2.6rem; font-weight: 600; line-height: 1; letter-spacing: -.02em; grid-row: span 2; }
.next .med { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; min-width: 0; }
.next .med span { min-width: 0; overflow-wrap: anywhere; }
.next .when { color: var(--muted); }
.today .row { min-height: 54px; }
.today .t { font-family: var(--font-num); font-weight: 600; width: 3.2em; flex: none; }
.bins { display: flex; flex-direction: column; gap: 10px; }
.bin { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.bin-head { display: flex; align-items: center; gap: 12px; }
.bin-head .grow { flex: 1; min-width: 0; }
.bin-head .title { font-weight: 700; overflow-wrap: anywhere; }
.meter { height: 10px; border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 10px; background: var(--rc, var(--accent)); }
.meter.low i { background: var(--warn); }
.bin-stats { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: .95rem; }
.bin-stats b { font-family: var(--font-num); font-weight: 600; }
.bin-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------- horarios: 7 compartimientos como un pastillero semanal ---------- */
.week { display: inline-grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.week span { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font-size: .7rem; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.week span.on { background: var(--rc, var(--accent)); color: #fff; }
.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.daypick label { position: relative; }
.daypick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.daypick span { display: grid; place-items: center; height: 48px; border-radius: 10px; border: 1px solid var(--line); font-weight: 700; background: var(--bg); }
.daypick input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.daypick input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.recpick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.recpick label { position: relative; }
.recpick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.recpick .opt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: 12px; border: 2px solid var(--line); text-align: center; font-size: .85rem; min-height: 92px; background: var(--bg); overflow-wrap: anywhere; }
.recpick input:checked + .opt { border-color: var(--accent); background: var(--accent-soft); }
.recpick input:focus-visible + .opt { outline: 3px solid var(--accent); outline-offset: 2px; }
.sched .t { font-family: var(--font-num); font-size: 1.35rem; font-weight: 600; width: 3.4em; flex: none; }
.sched .off { opacity: .55; }

/* ---------- segmentos ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 42px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.day-label { font-weight: 700; font-size: .9rem; color: var(--muted); padding: 4px 2px; }

/* ---------- dialogos ---------- */
dialog {
  border: 0; padding: 0; width: min(560px, 100%); max-height: min(92vh, 100%); margin: auto auto 0; border-radius: 20px 20px 0 0;
  background: var(--surface); color: var(--fg); box-shadow: 0 -8px 30px rgba(0,0,0,.2);
}
dialog::backdrop { background: rgba(10, 20, 18, .45); }
@media (min-width: 600px) { dialog { margin: auto; border-radius: 20px; } }
.sheet { display: flex; flex-direction: column; max-height: inherit; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 8px; }
.sheet-head h2 { font-size: 1.2rem; }
.sheet-body { padding: 8px 18px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.sheet-foot { display: flex; gap: 10px; padding: 12px 18px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.sheet-foot .btn { flex: 1; }

/* ---------- acceso ---------- */
.auth { max-width: 440px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 24px;
  padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark { width: 52px; height: 52px; border-radius: 14px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 30px; height: 30px; }
.brand h1 { font-size: 1.5rem; }
.auth .card { padding: 20px; }
.linkish { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }
.center { text-align: center; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40;
  background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 700; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .95rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<script src="firebase-config.js"></script>
<script src="backend.js"></script>
<script src="app.js"></script>
</body>
</html>
